risk_map:
  affected_behavior: spec-review classification, recording, governed settlement, packaged-resource loading, and result structure
  highest_impact_failure_modes: isolated review gains settlement authority; governed automation loads too late; universal review rules disappear; packaged reference is omitted
  changed_boundaries: [skill-contract, stage-owned-lifecycle, generated-package-parity]
  evidence_expected: complete semantic disposition, focused validators, full skill suite, package parity, clean installs, and final diff inspection
  direct_inspection_areas: [skill common path, governed reference, result asset, validator consumers, coupled contract amendments]
  intentionally_out_of_scope: [new runtime, new lifecycle schema, other skill redesign]
  applicable_risk_classes: [contract-preservation, lifecycle-authority, package-integrity, validation-coverage]
  non_applicable_risk_classes: [credentials, database-migration, network-publication]
  falsifiable_questions:
    - Can isolated formal review complete without loading governed settlement procedure?
    - Can governed settlement run before durable review recording succeeds?
    - Does every behaviorally significant rule retain exactly one destination?
    - Do generated, archived, and installed packages include the mapped reference?
