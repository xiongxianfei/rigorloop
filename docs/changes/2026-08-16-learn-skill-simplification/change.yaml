requirements:
  - Reduce the actual learn-session loaded context while preserving learn evidence quality, confirmation, recording, routing, and claim boundaries.
  - Keep universal trigger, evidence, confirmation, ownership, sensitive-data, stop, claim, and resource-selection behavior inline and add one conditional session-method reference.
  - Separate learn-owned session, topic, and exact route-backlink writes from owner-bound derivative work; expose no unobserved trigger-assessment operation.
  - Use deterministic unique session paths and fail closed on partial, ambiguous, or competing content without transaction-grade phase recovery.
  - Preserve the existing learn namespace, no-template direction, and periodic non-default lifecycle role.
  - Prove semantic and literal preservation, real LR0 and LR1 profile reduction, and canonical-through-installed parity without target-agent runtime acceptance.

tests:
  - Independent proposal review of value, package boundaries, operations, ownership, confirmation, measurement, compatibility, and spec readiness.
  - Deterministic scenarios covering trigger-owner closeout, unique session paths, fail-closed interruption, empty outcomes, confirmation, per-route settlement and backlinks, sensitive evidence, missing resources, and forbidden mutation.
  - Static package, selector, build, adapter, and lifecycle validation without a target-agent runtime or separate manual semantic-review acceptance gate.

