requirements:
  - Establish the existing local RigorLoop CLI as the guarded operation boundary for supported governed lifecycle transitions while preserving Git-tracked repository truth.
  - Keep semantic judgment, evidence recording, artifact settlement, workflow routing, and continuation authority explicitly separated.
  - Scope the first release to effective-state inspection, operation context, evidence and review recording, settlement, milestone transitions, validation, compatibility, migration, and controlled repair.
  - Preserve portable skill operation outside governed lifecycle transitions and exclude autonomous orchestration, PR execution, merging, deployment, and hosted control-plane behavior.
  - Require lifecycle integrity, stale-operation, deterministic-output, atomicity, fresh-checkout reconstruction, adapter integration, CI validation, and measured token-reduction proof before mandatory enforcement.

tests:
  - Independent proposal review of problem framing, option quality, product boundary, scope, trust claims, migration, architecture impact, and downstream readiness.
  - Downstream transition conformance fixtures for valid and invalid predecessors, unresolved findings, stale evidence, wrong identity, duplicate operations, milestone ordering, schema compatibility, migration, and repair.
  - Downstream determinism, fault-injection atomicity, fresh-checkout reconstruction, adapter integration, CI validation, and representative token-baseline comparisons.

