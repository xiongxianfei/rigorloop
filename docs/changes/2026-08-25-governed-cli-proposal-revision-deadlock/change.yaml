requirements:
  - A changes-requested review with open material findings settles its exact artifact to revision-required.
  - An approved or clean-with-notes review with open material findings remains blocked.
  - Status exposes record-artifact-revision after revision handback and does not expose it when another fatal blocker exists.
  - A later review context selects the next durable review round after revision.

tests:
  - Changes-requested settlement preserves open-finding identity and hands ownership back to the authoring stage.
  - Positive settlement with open findings remains rejected without changing repository bytes.
  - Revision-required status exposes only record-artifact-revision unless a fatal workflow blocker is also present.
  - Review context advances from a durable r1 record to r2.

