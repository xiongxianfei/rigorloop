requirements:
  - Record a proposal before changing lifecycle proof-modeling behavior or published skills.
  - Make examples subordinate to named rules, partitions, regressions, discovery gaps, or explicit non-normative roles.
  - Define a closed core boundary-dimension inventory with explicit applicability and non-applicability rationale.
  - Separate exhaustive partition and transition coverage from hazard-selected interaction coverage.
  - Keep normative behavior in feature specs and executable proof in matching test specs.
  - Preserve independent proposal, spec, architecture, plan, test-spec, code, and final verification review responsibilities.
  - Require sibling-boundary analysis when a material finding exposes one missed member of a boundary class.
  - Limit deterministic validation to stable structure, closed vocabularies, and traceability.
  - Amend the existing workflow and skill contracts instead of creating a competing boundary-modeling spec or lifecycle stage.
  - Apply the contract prospectively without invalidating accepted historical artifacts.
  - Establish the boundary capability baseline before resuming capability-preserving progressive disclosure.
  - Limit the first release to the eight-skill spec-to-proof-to-review chain plus its required governing and portability surfaces.
  - Separate mandatory closed core dimensions from optional namespaced feature-specific extensions.
  - Activate the public contract prospectively with grandfathering and synchronized all-or-nothing opt-in.
  - Gate rollout on seeded pre-code-review detection, behavior preservation, false-blocking, ownership, artifact-count, and simple-fixture overhead evidence.
tests:
  - Proposal-review approves the direction or records material findings before spec work.
  - Proposal-review records the first-release baseline, taxonomy extension, adoption cutover, and measurable-success gaps before proposal revision.
  - Proposal-review R2 confirms all four R1 findings resolved before proposal acceptance.
  - Proposal-review confirms examples are preserved without owning completeness.
  - Proposal-review confirms the proposal does not require an exhaustive Cartesian product.
  - Spec-review confirms exact boundary records, versioning, fixture identities, and capability-baseline aggregation.
  - Proposal-review confirms lifecycle and public-skill ownership are distinct and non-duplicative.
  - Artifact lifecycle validation covers the draft proposal.
  - Change metadata validation covers the proposal record.
