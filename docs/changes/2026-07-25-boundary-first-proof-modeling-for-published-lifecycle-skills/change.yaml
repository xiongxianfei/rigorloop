change_id: 2026-07-25-boundary-first-proof-modeling-for-published-lifecycle-skills
title: Boundary-first proof modeling for published lifecycle skills
classification: proposal
risk: high
artifacts:
  proposal: docs/proposals/2026-07-25-boundary-first-proof-modeling-for-published-lifecycle-skills.md
  spec: specs/rigorloop-workflow.md
