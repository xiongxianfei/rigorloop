change_id: 2026-07-06-subagent-assisted-code-review
title: Subagent-Assisted Code Review
classification: workflow-governance
risk: medium
artifacts:
  proposal: docs/proposals/2026-07-06-subagent-assisted-code-review.md
  spec: specs/subagent-assisted-code-review.md
  test_spec: specs/subagent-assisted-code-review.test.md
  plan: docs/plans/2026-07-06-subagent-assisted-code-review.md
requirements:
  - Record a proposal for subagent-assisted code review before downstream spec work.
  - Review the proposal for problem clarity, user value, option diversity, scope control, architecture awareness, testability, rollout realism, risk honesty, vision fit, and readiness for spec.
  - Preserve `code-review` as the reviewer of record.
  - Preserve subagents as read-only specialist evidence collectors.
  - Preserve review-resolution, verify, and PR readiness boundaries.
  - Normalize proposal status to accepted before downstream spec reliance.
  - Author the subagent-assisted code review spec from the accepted proposal.
  - Record architecture assessment before downstream plan reliance.
  - Create an execution plan before plan-review.
  - Review the execution plan before test-spec authoring.
  - Author a traceable test specification before test-spec-review.
  - Review the active test specification before implementation reliance.
tests:
  - Proposal includes Vision fit and matches the current project vision.
  - Proposal preserves the user's initial goals and scope constraints.
  - Proposal classifies broad workflow, validation, adapter, target-native, and deferred execution work through a scope budget.
  - Proposal-review R1 approves the proposal or records material findings before downstream spec reliance.
  - Review log indexes proposal-review R1 with zero material findings when clean.
  - Proposal status is normalized from draft to accepted after clean recorded proposal-review.
  - Spec defines role vocabulary, selection, packet shape, aggregation, coverage recording, advisory import behavior, and first-slice non-goals.
  - Spec-review R1 approves the spec or records material findings before downstream architecture or planning reliance.
  - Spec status is normalized from draft to approved after clean recorded spec-review.
  - Architecture assessment records architecture-not-required.
  - Plan sequences reviewable implementation milestones and validation commands before plan-review.
  - Plan-review R1 approves the plan or records material findings before test-spec reliance.
  - Test spec maps requirements, examples, edge cases, validation commands, and milestones to concrete proof.
  - Test-spec-review R1 approves the proof map or records material findings before implementation reliance.
  - M1 static proof covers the subagent-assisted code-review guidance required for reviewer-of-record authority, role selection, packet boundaries, aggregation, coverage recording, advisory import behavior, and first-slice non-goals.
  - M1 skill validation proves `skills/code-review/SKILL.md` remains structurally valid after the contract update.
  - M2 unit proof covers role selection, packet validation, aggregation dedupe/conflict/low-evidence behavior, and advisory import ownership.
  - M2 review-artifact proof covers subagent coverage rows, unknown role/status values, missing required coverage, inconclusive required coverage, conflict decisions, and advisory import summaries.
