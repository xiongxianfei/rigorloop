risk_map:
  affected_behavior: authorization of removable and retired states plus exact prospective R26 clause disposition
  highest_impact_failure_modes: pending evidence still authorizes deletion, incomplete prior state passes, a wrong R26 value passes, or unrelated acceptance behavior changes
  changed_boundaries: BND-STATE-001, BND-TEMPORAL-001, BND-RECOVERY-001, and BND-COMPAT-001
  evidence_expected: direct pending-state and wrong-value rejection, structured complete proof positives and negatives, targeted suite, and unchanged selector suite
  direct_inspection_areas: transition evidence validation, closed R26 mapping, mutation tests, ledger defaults, and R1 resolution scope
  intentionally_out_of_scope: CI graph changes, check deletion, Gate A/B/C consolidation, runtime invocation, and final verification
  applicable_risk_classes: [correctness, fail-closed-validation, lifecycle-state, compatibility, requirement-fidelity]
  non_applicable_risk_classes: [security-credentials, database-migration, network-publication, ui-accessibility]
  falsifiable_questions:
    - Does pending evidence now fail every removal-authority property?
    - Does the wrong value for an otherwise correct R26 key fail explicitly?
    - Can a complete structured proof pass without weakening blocked-contract handling?
    - Are both R1 findings corrected without acceptance-graph changes?
