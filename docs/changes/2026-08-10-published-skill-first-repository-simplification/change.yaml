requirements:
  - Make published skills and their installable distribution the primary product boundary.
  - Retain only scripts that protect a named public, governance, package, or release invariant.
  - Consolidate overlapping checks without weakening deterministic safety boundaries.
  - Restrict repository acceptance to deterministic skill, package, release, installer-filesystem, and lifecycle-governance invariants.
  - Keep semantic skill quality in human or agent review and do not execute target agent runtimes for acceptance.
tests:
  - Compare retained gates with the public failures and governance invariants they prevent.
  - Prove deterministic canonical skill integrity and package parity for all published adapter targets.
  - Prove release integrity by composing canonical skill and package proof.
  - Prove installer filesystem materialization only when installer logic exceeds package copying.
  - Prove retired checks do not remove required negative-path coverage.
