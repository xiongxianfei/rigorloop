change_id: 2026-08-11-skill-markdown-paragraph-guidance
title: Keep Generated Markdown Sentences Intact
classification: published-skill-contract
risk: low
artifacts:
  spec: specs/markdown-readability-contract.md
requirements:
  - Instruct skills to write ordinary prose as normal Markdown paragraphs.
  - Do not split one sentence across physical source lines merely for wrapping or clause separation.
  - Reflow existing canonical skill prose that already splits sentences across physical source lines.
  - Preserve structural line boundaries for Markdown lists, tables, commands, headings, and other structural units.
tests:
  - Every affected skill contains the intact-sentence guidance and omits the former clause-per-line guidance.
  - Every affected authoring skeleton requests normal prose paragraphs and complete sentences.
  - Canonical skill prose produces no suspected sentence-split diagnostics.
  - Canonical and generated skill validation passes.
