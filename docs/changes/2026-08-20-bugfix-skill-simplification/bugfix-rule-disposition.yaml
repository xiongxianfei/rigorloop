schema: bugfix-rule-disposition-v1
allowed_dispositions: [retained-inline, amended, removed-duplicate, incidental]
unlisted: retained
rules:
  - id: expected-behavior
    disposition: amended
    owner: skills/bugfix/SKILL.md
    covers: [settled-basis, resolvable-restoration, contract-owner-routing]
  - id: reproduction
    disposition: amended
    owner: skills/bugfix/SKILL.md
    covers: [reproduced, deterministic-alternative, uncertainty]
  - id: root-cause
    disposition: amended
    owner: skills/bugfix/SKILL.md
    covers: [closed-causes, supported-cause, owner-routing]
  - id: regression-test-first
    disposition: amended
    owner: skills/bugfix/SKILL.md
    covers: [proof-authoring, test-feasibility, proof-identity]
  - id: minimal-fix
    disposition: retained-inline
    owner: skills/bugfix/SKILL.md
    covers: [root-cause-correction, scoped-diff]
  - id: blast-radius-validation
    disposition: amended
    owner: skills/bugfix/SKILL.md
    covers: [identity-equal-proof, surrounding-validation, failed-check-stop]
  - id: durable-doc-routing
    disposition: amended
    owner: exact-artifact-owner
    covers: [read-only-upstream, no-implicit-placement]
  - id: evidence-reading
    disposition: retained-inline
    owner: skills/bugfix/SKILL.md
    covers: [bounded-evidence, full-file-trigger]
  - id: duplicated-narrative
    disposition: removed-duplicate
    owner: skills/bugfix/SKILL.md
    covers: [process-rules-output-overlap]
architecture_triggers:
  persistent-bug-transaction: absent
  repair-engine: absent
  external-issue-integration: absent
  cross-stage-state-owner: absent
  separate-diagnosis-skill: absent
