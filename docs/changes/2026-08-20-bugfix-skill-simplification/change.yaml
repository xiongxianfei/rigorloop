requirements:
  - Keep bugfix as one compact skill while closing diagnosis, command, write, proof, routing, and result contracts.
  - Separate diagnosis, proof authoring, production correction, and post-fix validation with exact authority and evidence gates.
  - Preserve upstream and lifecycle ownership, explicit-step handoff, deterministic proof identity, and fail-closed governed signals.
  - Measure complete-package words and bytes without letting those metrics override truthful semantics, and add no resources, scripts, runtime machinery, or target-agent acceptance.

tests:
  - Independent specification, plan, and test-spec reviews before implementation.
  - Deterministic scenarios for every closed value, authority boundary, phase gate, routing outcome, retry identity, and claim limit.
  - Rule and literal preservation plus canonical, generated, packed, archived, release-candidate, and installed package parity.

