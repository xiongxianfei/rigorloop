initial_packet:
  included:
    - exact base and reviewed-subject revisions
    - complete changed-path inventory
    - governing proposal, spec, architecture, ADR, plan, and test-spec paths
    - formal code-review criteria
  excluded:
    - author hidden reasoning
    - author self-assessment
    - desired review outcome
    - validation-result summaries
    - evidence menu
    - prior finding content
    - correction eligibility or budget
risk_map:
  affected_behavior:
    - published explain-change skill loading, authority, output, and handback contracts
    - final-review S-to-R-to-E code-state validation and workflow integration
    - lifecycle metadata and canonical architecture ownership
  highest_impact_failure_modes:
    - universal truthfulness or review-closeout rules become conditionally unavailable
    - invalid or broader evidence tails are accepted as current
    - generated or installed packages drift from canonical skill resources
    - duplicate lifecycle ownership survives final correction
    - proposal status and readiness contradict each other
  changed_boundaries:
    - portable versus governed explanation procedure
    - inline versus durable output
    - final reviewed subject versus review and explanation evidence revisions
    - review subject versus lifecycle settlement target
  expected_direct_evidence:
    - exact requirement-to-test and boundary-to-proof mappings
    - focused explain-change contract tests
    - workflow automation and code-state tests
    - skill package, generated output, adapter, lifecycle, and review-closeout validation
    - complete diff and ownership inspection
  direct_inspection_areas:
    - skills/explain-change
    - scripts/workflow_code_state.py
    - scripts/workflow_automation.py
    - directly coupled tests and fixtures
    - change-local lifecycle and review evidence
  intentionally_out_of_scope:
    - target-agent runtime execution
    - live PR, hosted CI, release, publication, or deployment
  falsifiable_questions:
    - Does every supported assembly preserve universal obligations and shrink in words and bytes?
    - Can any malformed signal, broader tail, unknown field, or duplicate owner pass silently?
    - Do generated, archived, release-candidate, and installed resources preserve required parity?
    - Does the lifecycle correction alter implementation behavior or only restore metadata consistency?
phase_receipts:
