requirements:
  - Reduce loaded procedure for all four explain-change assemblies while preserving actual-diff grounding, evidence truthfulness, scope, validation gaps, stops, claims, and resource safety.
  - Use one governed-workflow reference and one structural explanation skeleton without scripts, runtime generation, or prose grading.
  - Separate portable and governed context, inline and durable output, create and refresh authority, and reviewed-subject identity from the closed explanation evidence tail.
  - Require current-skeleton whole-file composition for every durable create or refresh and one atomic replacement with fail-closed uncertainty handling.
  - Replace verification-readiness language with an explain-change-owned workflow handback that leaves routing and readiness with their owning stages.
  - Preserve semantic and literal compatibility, all-profile word and byte reduction, and canonical-through-installed package parity.

tests:
  - Independent specification, plan, and test-spec review before implementation.
  - Deterministic scenarios for governed-signal classification, output actions, resource assemblies, refresh authority, atomic replacement, evidence-tail identity, handback claims, and missing resources.
  - Static semantic, literal, package, generated-output, adapter, and measurement proof without target-agent runtime execution.

