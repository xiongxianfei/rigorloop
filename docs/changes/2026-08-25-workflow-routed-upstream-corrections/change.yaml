requirements:
  - Provide a workflow-requested, CLI-validated upstream correction route that preserves findings, milestone state, and return context.
  - Prevent cross-change artifact-path collisions and provide a narrow guarded recovery for existing duplicate registrations.
  - Keep semantic routing with workflow and semantic artifact work with the owning stage while the CLI enforces mechanical validity.
tests:
  - Closed route-matrix, stale-operation, authority, retry, and return-readiness conformance.
  - Cross-change collision detection and exact duplicate-withdrawal recovery without semantic artifact mutation.
  - Human and JSON diagnostic parity plus unchanged portable-mode behavior.
