title: Workflow Guide Skeleton Asset and Source-of-Truth Alignment
classification: workflow-governance
risk: medium
artifacts:
  proposal: docs/proposals/2026-07-05-workflow-guide-skeleton-asset.md
  spec: specs/workflow-skill-artifact-location-map.md
