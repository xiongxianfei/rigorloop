requirements:
  - Record the workflow guide skeleton asset proposal before proposal-review.
  - Preserve source-of-truth layering between approved specs, the workflow skill, the project workflow guide, and stage skills.
  - Keep the proposed skeleton structural and avoid hidden lifecycle policy.
  - Preserve stage-skill portable defaults and customer-project portability.
  - Record proposal-review R1 before downstream spec reliance.
  - Normalize the proposal status to accepted after clean recorded proposal-review.
  - Amend the workflow artifact-location map spec with the workflow-guide skeleton contract.
  - Record spec-review R1 before downstream plan reliance.
  - Record architecture assessment before downstream plan reliance.
  - Create an execution plan before plan-review.
  - Record plan-review R1 before downstream test-spec reliance.
  - Amend the workflow-map test spec before test-spec-review.
  - Record test-spec-review R1 before downstream implementation reliance.
  - Implement M1 canonical workflow-guide skeleton asset and workflow skill resource map.
  - Record code-review M1 R2 before starting M2 implementation.
  - Implement M2 workflow-guide skeleton validation coverage and guide-system composition.
  - Record code-review M2 R1 before starting M3 implementation.
  - Implement M3 generated skill and adapter packaging proof for the workflow skeleton asset.
  - Record behavior-preservation evidence before final verification.
  - Record code-review M3 R1 before final closeout stages.
tests:
  - Proposal includes Vision fit and matches the current project vision.
  - Proposal preserves the user's initial goals and scope constraints.
  - Proposal classifies broad workflow, validation, packaging, generated-output, and migration work through a scope budget.
  - Proposal-review R1 approved the proposal with no material findings.
  - Proposal status is normalized from draft to accepted before downstream spec reliance.
  - Spec amendment adds skeleton asset, resource-map, structural section, validation, packaging, and non-migration requirements.
  - Spec-review R1 approved the amended spec with no material findings.
  - Architecture assessment records architecture-not-required for this workflow/spec/validation amendment.
  - Execution plan sequences skeleton asset, validation, packaging proof, and lifecycle closeout milestones before plan-review.
  - Plan-review R1 approved the execution plan with no material findings.
  - Test spec maps skeleton requirements, examples, edge cases, and acceptance criteria to concrete proof cases.
  - Test-spec-review R1 approved the proof map with no material findings.
  - M1 tests prove skeleton existence, resource-map COPY mapping, metadata comments, required sections, structural boundary, and no full skeleton body in the workflow skill.
  - M1 review-fix tests prove source-rank terms remain present and the skeleton does not include the full stage-obligations policy table.
  - Code-review M1 R2 closed M1 with no material findings.
  - M2 tests prove skeleton validation composes workflow-map registry/table checks and rejects missing sections, missing required registry entries, and table drift.
  - Code-review M2 R1 closed M2 with no material findings.
  - M1 leaves existing docs/workflows.md and stage-skill placement text unchanged because no direct contradiction or migration is in scope for the asset/mapping milestone.
  - M3 tests prove generated skill mirror output includes workflow/assets/workflows-skeleton.md.
  - M3 adapter tests prove adapter archives include workflow/assets/workflows-skeleton.md whenever the workflow skill is packaged.
  - M3 records non-Codex workflow adapter packaging as not applicable while existing portability rules exclude workflow from those adapters.
  - Code-review M3 R1 closed M3 with no material findings.
