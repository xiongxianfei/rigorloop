  proposal: docs/proposals/2026-08-19-ci-maintenance-skill-simplification.md

requirements:
  - Reduce real loaded CI-maintenance profiles while preserving command authority, risk coverage, least privilege, secret safety, and claim boundaries.
  - Separate operation, target kind, concern, provider, privileged authority, structure, and resource selection.
  - Give semantic risk placement, GitHub serialization, and workflow structure exactly one owner each.
  - Preserve current repository-file target kinds and bind privileged implementation to an exact approved design.
  - Use conditional single-file commits and dependency-aware non-atomic batch behavior without persistent coordination.
  - Preserve static proof, package-resource parity, and hosted-CI truthfulness without live CI or target-agent execution.

tests:
  - Independent specification, plan, and test-spec reviews before implementation.
  - Deterministic scenarios for closed classifications, resource assemblies, policy ownership, conditional commits, batch dependencies, failure behavior, and claim limits.
  - Canonical, generated, packed, archived, and installed resource parity plus before-and-after profile measurements.

