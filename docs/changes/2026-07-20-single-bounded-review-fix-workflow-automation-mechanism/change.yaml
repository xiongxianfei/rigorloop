  proposal: docs/proposals/2026-07-20-single-bounded-review-fix-workflow-automation-mechanism.md
  spec: specs/single-bounded-review-fix-workflow-automation.md
  architecture: docs/architecture/system/architecture.md
  adr: docs/adr/ADR-20260721-single-bounded-review-fix-workflow-automation.md
  plan: docs/plans/2026-07-21-single-bounded-review-fix-workflow-automation.md
  test_spec: specs/single-bounded-review-fix-workflow-automation.test.md
  review_resolution: docs/changes/2026-07-20-single-bounded-review-fix-workflow-automation-mechanism/review-resolution.md
requirements:
  - Record one decision-oriented proposal for bounded-review-fix as the only writable automation mechanism.
  - Preserve formal proposal-review findings before review-driven proposal revision.
  - Resolve canonical workflow position, identity-bound grants, interrupted-transition recovery, and repeated-stage target identity before specification.
  - Include proposal-review through a non-circular identity-bound review capability without weakening review independence or later authorization boundaries.
  - Separate bounded parent authorization from executable effective capability and use stage-appropriate basis identities.
  - Separate proposal-review occurrence recording from clean-gate satisfaction and route every closed review outcome deterministically.
  - Define one contract for structured targets, canonical workflow-position ownership, authorization and capability boundaries, transition recovery, stage routing, and legacy migration.
  - Define closed target-occurrence, durable-state, verification-authorization, legacy-adapter, and exact cross-spec precedence contracts.
  - Consolidate persisted automation authority into one canonical spec while preserving lifecycle ordering and reviewer-owned finding semantics in their existing contracts.
  - Define the component boundaries, runtime recovery flow, deployment boundary, quality scenarios, migration risks, and durable ADR supersession for the unified mechanism.
tests:
  - Proposal lifecycle validation covers the revised proposal.
  - Review artifact validation covers proposal-review R1 through R4, spec-review R1 through R3, and all thirteen recorded material findings.
  - Change metadata validation covers the change-local review evidence pack.
  - Proposal-review R4 rechecks the two-level authorization invariant and complete proposal-review outcome routing.
  - Spec-review must challenge the unified mechanism contract before it becomes approved or supersedes conflicting legacy requirements.
  - Spec-review R2 must recheck BRF-SR1 through BRF-SR5 against the revised spec and co-amended legacy specs.
  - Spec-review R4 must recheck unique source selectors, the closed affected-selector registry, and sole automation-spec ownership.
  - Architecture-review must challenge component ownership, canonical-state boundaries, authority separation, receipt recovery, migration, and external-action containment before planning.
  - Architecture-review R2 must confirm complete stage-policy projection, one executable and persistence ownership boundary, and effective-capability receipt binding.
  - Plan-review must challenge milestone sequencing, requirement coverage, migration safety, validation commands, and recovery before test-spec authoring.
  - Test-spec-review must challenge the requirement, example, edge-case, command, fixture, and milestone proof maps before M1 implementation.
  - M1 policy tests prove one immutable sixteen-field policy per public and internal automatable stage, including closed target occurrences and bounded mutation categories.
  - M1 automation-state tests prove closed vocabularies, legal status transitions, non-executable parent authority, stage-relative capability basis, and parent-scope containment.
  - Change-metadata regressions prove the unified namespace accepts only bounded-review-fix state, rejects live workflow ownership, and rejects mixed unified and legacy writable state.
