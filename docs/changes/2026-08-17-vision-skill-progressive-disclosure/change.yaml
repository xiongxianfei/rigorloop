requirements:
  - Reduce the actual loaded procedure for README synchronization, editorial revision, and strategic authoring while preserving the approved vision contract and avoiding an unsupported formal assessment profile.
  - Keep universal authority, state classification, canonical-path, revision-classification, safety, stop, claim, and resource-selection behavior inline.
  - Use one strategic-authoring reference, one README-synchronization reference, one vision skeleton, and one strategic-positioning skeleton under the existing published-skill package model.
  - Preserve README synchronization as the establishment and revision default, with omission allowed only under exact current identity-bound skip authority and every strategic/README combination represented explicitly.
  - Classify positioning, README, and structural-asset actions independently and use one source-first target manifest with fail-closed partial recovery for multi-artifact writes.
  - Bind README insertion or skip authority to the exact manifest and prior-to-intended vision transition, including the explicit sync-skip path.
  - Preserve root VISION.md authority, strategic-positioning rationale, README marker safety, state-based behavior, word limits, and substantive change-local linkage.
  - Prove semantic and literal preservation, real procedural-profile reduction, and canonical-through-installed parity without target-agent runtime acceptance.

tests:
  - Independent proposal review of value, package boundaries, operation closure, structural ownership, compatibility, measurement, and spec readiness.
  - Deterministic scenarios covering all six loaded assemblies, independent asset selection, absent and existing vision state, editorial and substantive revision, positioning actions, manifest-bound README authority, target transitions, partial retry, marker failures, retired lowercase path handling, and missing resources.
  - Static skill, package, adapter, selector, lifecycle, and compatibility validation without a target-agent runtime or separate prose-grading system.

