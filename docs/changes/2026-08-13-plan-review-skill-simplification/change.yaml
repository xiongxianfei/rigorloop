requirements:
  - Preserve plan-quality judgment, formal recording, reviewed-plan settlement, boundary-first behavior, isolation, automation limits, and claim boundaries while reducing portable and governed procedural context.
  - Give universal review policy, governed settlement procedure, boundary method, and structural output one explicit owner each.
  - Distinguish initial semantic review from identity-matching settlement retry without allowing plan-review to initialize planned work or advance routing.
  - Prove semantic preservation, literal compatibility, profile reduction, state-transition safety, and package parity without target-agent runtime execution.

tests:
  - Independent semantic review of the proposal and final skill package.
  - Deterministic validation of closed operations, authority axes, resource profiles, mapped resources, asset structure, recording, settlement, failure behavior, and package parity.
  - Static lifecycle scenarios proving initial-review evidence, initialization-required, exact settlement retry, stale and conflicting identity stops, and forbidden writes.

