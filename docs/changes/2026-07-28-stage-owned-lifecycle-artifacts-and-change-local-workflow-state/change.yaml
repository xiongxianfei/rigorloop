requirements:
  - Record the isolated formal proposal review before any review-driven revision.
  - Resolve artifact settlement, proof attribution, and deferred-follow-up ownership before specification.
  - Preserve the selected portable stage-ownership direction without adding document hashes or write interception.
  - Let authoring peers mark only their matching artifact state as review-required before revision.
  - Let review peers settle only their matching artifact state after durable review evidence exists.
  - Keep workflow routing separate from authoring invalidation and review settlement.
  - Treat one workflow automation target as bounded repository-local continuation consent without adding another public authorization parameter.
  - Define the prospective activation, compatibility, error, and proof contract before implementation.
  - Apply boundary-first-v1 with all eight dimensions, selected composed hazards, and requirement-owned examples.
  - Make canonical published skills and generated adapters the primary ownership conformance surface.
  - Use the stage-owned change-local model as the sole forward lifecycle-state mechanism.
  - Align Constitution, AGENTS, workflow guidance, and the project map before spec approval.
  - Replace the canonical plan-owned and capability-driven workflow architecture with stage-owned change-local lifecycle state.
  - Preserve one target, review independence, evidence-first recovery, migration, and the external-action boundary without a second selector layer.
  - Sequence implementation into boundary-owned, reviewable milestones with atomic prospective activation.
tests:
  - Review artifact validation accepts the detailed review, log, and open resolution records.
  - Change metadata validation accepts the proposal-review change root.
  - Proposal review challenges transition-scoped settlement and the automation compatibility amendment.
  - Spec review challenges the exact state, transition, migration, and authorization contract.
  - Boundary validation rejects missing dimensions, invalid IDs, unmapped examples, and unowned interactions.
  - Plan review challenges requirement coverage, boundary ownership, activation sequencing, validation commands, and rollback units before test-spec.
  - Test-spec review challenges all 122 requirements, 35 acceptance criteria, 13 examples, 25 edge cases, eight boundaries, seven interactions, 26 test cases, two agent semantic-review procedures, and 32 dependent proof-map projections before M1.
