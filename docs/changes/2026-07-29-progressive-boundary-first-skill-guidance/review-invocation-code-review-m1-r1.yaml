    - closed-vocabulary
    - filesystem-containment
    - mutation-atomicity
    - retry-idempotency
    - authority-separation
    - compatibility
    - derived-artifact-currency
    - diagnostics
  non_applicable_risk_classes:
    - network-service
    - authentication
    - database-migration
    - ui-accessibility
  falsifiable_questions:
    - Does a different valid source, target, or known-consumer matrix fail against the exact ADR contract?
    - Can manifest-driven projection and skill validation agree on a corrupted authority?
    - Does a second-or-later target write failure leave every prior target unchanged?
    - Does every additional or missing family projection fail?
    - Is projection identity exactly the complete sorted 14-record set?
    - Does the resource split preserve prior semantics exactly once and within owner scope?
    - Do all ten skill maps contain exactly their owned resources and READ conditions?
    - Are diagnostics stable and repository-relative?
    - Does write preflight cover late destination and interruption failures?
    - Does pending activation reject every manifest or projection drift?
