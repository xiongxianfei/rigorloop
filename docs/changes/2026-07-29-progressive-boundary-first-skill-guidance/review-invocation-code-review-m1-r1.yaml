  affected_behavior: closed manifest parsing, three-resource ownership, 14-target projection, skill resource validation, and pending activation identity
  highest_impact_failure_modes: wrong exact matrix accepted, circular manifest proof, partial write after a late failure, semantic loss during split, unsafe path escape, or incomplete activation identity
  changed_boundaries: manifest authority, canonical-to-skill composition, compatibility-stable compact path, multi-target mutation, validation authority, and recovery
  evidence_expected: T1, T2, and T5 negative matrices; independent hashes; exact resource maps; interruption proof; pending activation proof; repository-relative diagnostics
  direct_inspection_areas: manifest parser, exact-matrix enforcement, path and symlink containment, projection transaction, digest construction, activation validation, skill validation, resource split, and negative fixtures
  intentionally_out_of_scope: M2 compact scan and routing, M3 selector routing, M4 package and activation readiness, PR, CI, and final verification
