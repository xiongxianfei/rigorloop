  changed_boundaries: identity authority, composition and containment, temporal retry, recovery, compatibility, pending state, and filesystem environment
  evidence_expected: exact manifest mutation matrix, T1/T2/T5 negatives, all-position interruption recovery, semantic accounting, exact maps, independent digests, and public diagnostics
  direct_inspection_areas: manifest invariants, projection authority, path and inventory scans, write restoration, activation, skill validation, canonical split, maps, and tests
  intentionally_out_of_scope: M2 runtime guidance, M3 selector routing, M4 package parity and activation readiness, PR, and final verification
  applicable_risk_classes:
    - identity-authority
    - composition-path
    - temporal-retry
    - failure-recovery
    - compatibility-migration
    - pending-state
    - filesystem-containment
    - requirement-fidelity
    - diagnostics
  non_applicable_risk_classes:
    - network-service
    - credentials
    - database-migration
    - ui-accessibility
  falsifiable_questions:
    - Does the manifest determine every relation without a parallel matrix?
    - Do invalid known tuples fail closed with actionable diagnostics?
    - Does every catchable interruption restore present and absent targets?
    - Can restoration failure or topology change be mistaken for success?
    - Are additional resources detected without rejecting unrelated files?
    - Is the 14-record projection digest complete and raw-byte exact?
    - Does the split preserve every prior semantic rule exactly once?
    - Do CLI, activation, and skill validation preserve structured identity?
