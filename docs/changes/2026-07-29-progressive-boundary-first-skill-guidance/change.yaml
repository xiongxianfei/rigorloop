requirements:
  - Make concise boundary awareness automatic without requiring users to name the method.
  - Preserve one authoritative boundary model and prevent stage-local semantic drift.
  - Load formal authoring and proof guidance only in the stage families that own it.
  - Let downstream stages consume exact approved artifact slices instead of recreating the model.
  - Preserve portable packages, deterministic projection, and atomic activation.
  - Stop routing published skill text through artifact-lifecycle validation.
  - Resolve current governed-artifact lifecycle state from the exact owning change-record entry while preserving explicit legacy compatibility.
  - Let plan initialize missing primary-plan planned work once while workflow owns every later transition.
tests:
  - New behavior-contract guidance activates formal boundary authoring without a method-name prompt after capability activation.
  - Non-behavior work performs no unnecessary formal boundary-record authoring.
  - Governed skill families map only the boundary resources required by their stage responsibility.
  - Downstream guidance consumes approved boundary and proof IDs without redefining them.
  - Canonical, generated, packed, and installed mapped resources retain deterministic parity.
  - Skill-only changes retain purpose-built checks without selecting artifact-lifecycle validation.
  - Mixed changes still select lifecycle validation for governed artifacts and change records.
  - Current stage-owned artifacts without embedded status resolve exact ownership and fail closed on missing, duplicate, ambiguous, mismatched, or unknown state.
  - A new primary plan initializes deterministic planned work once and cannot replace existing planned work.
