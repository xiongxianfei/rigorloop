    - credentials
    - database-migration
    - ui-accessibility
  falsifiable_questions:
    - Is the manifest the sole declarative matrix without a competing authority?
    - Does every unknown or malformed state fail before mutation?
    - Can any interruption or restore failure leave accepted partial state?
    - Are additional resources detected without rejecting unrelated files?
    - Is the 14-record projection digest complete and raw-byte exact?
    - Does the split preserve every prior semantic rule exactly once?
    - Are all ten maps exact and stage-specific?
    - Do CLI, activation, and skill validation preserve structured resource identity?
