requirements:
  - Reduce portable and governed PR loaded context while preserving evidence truthfulness, submission safety, external-action authority, and claim ownership.
  - Keep universal target, verify, remote, CI, operation, push, read-back, stop, and claim behavior inline; add one governed-readiness reference and one structural PR-body asset.
  - Bind verification, local head, pushed remote head, and PR head exactly and reconcile existing PRs idempotently without duplicate creation or implicit draft publication.
  - Keep verify as the branch-ready and normalized base/head evidence owner; treat its result/report amendment and compatibility proof as a directly coupled same-slice dependency.
  - Preserve every behaviorally significant rule and exact literal dependency with change-local ownership and compatibility evidence.
  - Prove real profile reduction and canonical-through-installed parity without live acceptance PR creation or target-agent runtime execution.

tests:
  - Independent proposal review of value, package boundaries, target and remote state, CI truthfulness, governed authority, idempotency, measurement, and readiness.
  - Deterministic validation of resource mappings, classifications, operations, remote states, CI states, body groups, missing resources, stops, claims, and forbidden mutation.
  - Static scenarios covering portable and governed PRs, absent and existing PRs, drafts, stale verification, push and read-back failure, retries, CI states, and package parity.
  - Static verification-basis scenarios covering normalized portable and governed evidence, immutable identities, legacy reports, missing or ambiguous basis, and fresh-verify routing.

