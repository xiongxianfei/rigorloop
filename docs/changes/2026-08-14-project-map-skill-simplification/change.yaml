requirements:
  - Reduce every real project-map loaded profile while preserving current-state evidence, freshness, customer portability, and downstream reliance safety.
  - Replace overlapping modes with independent operation and scope classifications and one closed profile matrix.
  - Give universal orientation policy, conditional maintenance and area procedure, and structural output one explicit owner each.
  - Bind create, refresh, and audit to target state and make coordinated area creation identity-bound, recoverable, and root-registration-last.
  - Amend the governing project-map spec and bounded architecture text that currently require the old classification and inline policy placement.
  - Prove semantic preservation, literal compatibility, profile reduction, resource failure, and package parity without target-agent runtime execution.

tests:
  - Independent semantic review of the proposal and final project-map package.
  - Deterministic validation of classifications, procedural assemblies, authority, resources, freshness, evidence classes, structure, stops, and package parity.
  - Static scenarios covering target-state operation selection, coordination preflight, root and area create, refresh, audit, dirty baselines, area transaction recovery, correction notes, overlaps, contradictions, commands, missing resources, and forbidden claims.

