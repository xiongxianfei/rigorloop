requirements:
  - Reduce every real proposal-authoring loaded assembly while preserving decision quality, intent, standing gates, customer portability, lifecycle authority, and proposal-review handoff.
  - Separate governed lifecycle authoring from strategic and broad-scope gate procedure through two independently triggered references.
  - Define closed portable and governed assemblies, create and revise operations, structural-group applicability, resource failure, and one-owner boundaries.
  - Preserve every behaviorally significant rule and classify exact literal dependencies separately from semantic rules.
  - Prove package integrity and profile reduction without target-agent runtime execution, prose classification, or a separate manual semantic-review acceptance gate.

tests:
  - Formal independent proposal review of direction, scope, triggers, authority, ownership, compatibility, and readiness.
  - Deterministic validation of resource mappings, closed classifications, operations, authority failures, structural groups, stops, claims, and package parity.
  - Static scenarios covering four assemblies, create and revise, specialized predicate combinations, late loading, missing resources, conflicting identity, forbidden writes, and forbidden claims.

