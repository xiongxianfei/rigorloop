requirements:
  - Reduce architecture-assessment, portable-authoring, and governed-authoring loaded context while preserving architecture applicability, C4, arc42, ADR, lifecycle, review, and handoff behavior.
  - Keep universal assessment and safety inline, add one conditional package-method reference and one governed-authoring reference, and preserve exactly the three existing structural assets.
  - Separate architecture action, target operation, governed signal, and execution authority with fail-closed classification, current assessment binding, a durable prepared manifest, and dependency-aware multi-artifact recovery.
  - Preserve every behaviorally significant rule and classify exact literal dependencies separately from semantic rules.
  - Prove canonical-through-installed package parity and real profile reduction without target-agent runtime execution, prose classification, or a separate manual semantic-review acceptance gate.

tests:
  - Formal independent proposal review of value, scope, assessment ownership, reference boundaries, artifact transactions, recovery, measurement, and readiness.
  - Deterministic validation of resource mappings, action and target operations, governed authority, assessment isolation, missing resources, stops, claims, and package parity.
  - Static scenarios covering assessment, portable and governed authoring, canonical and ADR operations, combined actions, identical retry, partial writes, concurrency, and forbidden mutation.

