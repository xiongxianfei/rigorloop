requirements:
  - Reduce architecture-review loaded context while preserving architecture judgment, review recording, lifecycle settlement, independence, and handoff behavior.
  - Keep universal review safety inline, add one conditional architecture-package review reference and one conditional recording-and-settlement reference, and add no runtime engine or new lifecycle owner.
  - Separate review surface, recording requirement, settlement authority, and automation mode with fail-closed classification and exact multi-target identity.
  - Preserve every behaviorally significant rule and classify exact literal dependencies separately from semantic rules.
  - Prove canonical-through-installed package parity and real profile reduction without target-agent runtime execution, prose classification, or a separate manual semantic-review acceptance gate.

tests:
  - Formal independent proposal review of value, scope, method ownership, recording authority, multi-target settlement, measurement, and readiness.
  - Deterministic validation of resource mappings, review surfaces, modes, exact targets, missing resources, stops, claims, and package parity.
  - Static scenarios covering no-impact, upstream gaps, canonical packages, ADRs, combined targets, isolated recording, governed settlement, retry, concurrency, and forbidden mutation.

