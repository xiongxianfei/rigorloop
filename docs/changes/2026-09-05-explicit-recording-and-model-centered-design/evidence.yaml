  ,{"actor":{"id":"repository-cleanup","role":"support"},"id":"retained-implementation-m1","procedure":"Historical evidence retention during user-authorized repository cleanup; no historical command was rerun or reassessed by this entry.","result":"inconclusive","subjects":[{"identity":"sha256:3dfc7e53a04e49c3c91421c532500af8632610711e25d2c8af7c444c8c46f2c8","path":"docs/implementation/explicit-recording-m1.md"}],"summary":"Retained verbatim from docs/implementation/explicit-recording-m1.md. Relative links, statuses, commands and identities below belong to that original historical document; they are not current navigation, approvals or verification.\n\n# Explicit Recording M1 — Isolated Implementation Evidence\n\n## Authority and scope\n\nThe user explicitly approved an M1-only implementation exception using the independently reviewed model designs and delivery plan, before formal registration. This permits schema/fixture/validation foundations and independent Code Review, not public writers, lifecycle activation, historical migration or M2. This is IP0 isolated work; no governed milestone or formal review identity is fabricated.\n\nBasis: [delivery plan M1](../plans/2026-09-05-explicit-recording-and-model-centered-design.md), [Workflow model](../design/workflow.md), [CLI model](../design/cli.md), and [advisory Delivery rereview](../reviews/explicit-recording-and-model-centered-design-delivery.md). All preexisting changes on `feature/explicit-recording-model-design` are preserved.\n\n## Completeness and proof allocation\n\nTG-01 covers all five Workflow record types, transient request and result, closed vocabularies, required/unknown fields, duplicate identities/keys/paths, representation limits, exact encoding and candidate references. TG-02 covers rejection of historical/unknown discriminators, absent-root creation and no public writer. Current subject freshness, commands and persistence remain M2; M1 does not claim those behaviors.\n\nThe new validator must not import semantic eligibility from existing engines. Metadata dispatch and old schemas stay unchanged because ordinary adoption is withheld; cross-contract rejection is exercised at the new validation boundary and through existing public-command rejection. Tests and evidence must distinguish representation validation from workflow approval.\n\n## Execution evidence\n\nTests were written before implementation. The first focused run failed with `ERR_MODULE_NOT_FOUND` for the not-yet-created validation module, establishing the initial red result.\n\nThe isolated implementation adds the canonical `schemas/explicit-recording-v1.schema.json`, its packaged counterpart under `packages/rigorloop/dist/schemas/`, the representation-only `record-store-contract.js` module, `record-store-contract.test.js`, the seven-kind fixture under `tests/fixtures/explicit-recording-v1/`, and `scripts/build-record-store-schema.mjs` for reproducible bundling and read-only parity checks. No existing dispatcher, historical schema or governed lifecycle state was changed by M1.\n\nCommands actually run on this slice:\n\n| Command | Result |\n| --- | --- |\n| `node --test packages/rigorloop/test/record-store-contract.test.js` | After corrections: 17 passed, zero failed |\n| `npm --prefix packages/rigorloop test` | After corrections: 491 tests: 489 passed, 2 skipped, zero failed |\n| `python scripts/test-change-metadata-validator.py` | 112 passed |\n| `node scripts/build-record-store-schema.mjs --check` | Exit 0; canonical/package bytes match |\n| `git diff --check` | Exit 0 |\n\nThe broader regressions include the preserved working-tree changes; their success is not a review or ownership claim for those unrelated changes. The two skipped package tests remain skipped; no claim is made that they ran. M2, adoption, formal lifecycle closeout, branch readiness and PR readiness are not claimed.\n\n## Independent review corrections\n\nThe [independent advisory M1 Code Review](../reviews/explicit-recording-m1-code-review.md) recorded three findings before correction: overlapping decision-basis/write paths (ER-M1-001), distinct diagnostics incorrectly sharing path identity (ER-M1-002), and incomplete inspected-snapshot representation validation (ER-M1-003).\n\nFocused regressions were added first and reproduced all three defects: 14 passed and 3 failed. The bounded corrections enforce disjoint read/write paths, use complete diagnostic identity instead of path-only identity, and validate inspected manifest/content encoding, per-file limits, exact registry membership, change/review identities, byte revision, explicit missing-sidecar observations and absent-root shape. They neither access live decision-basis files nor enforce lifecycle eligibility. After correction all 17 focused tests passed, followed by the broader commands above. An additional otherwise-valid fixture test directly demonstrates duplicate, escaped-duplicate and nested-duplicate key rejection.\n\nThe review record owns the independent rereview judgment and finding disposition. No next milestone is authorized by this implementation evidence.\n"},{"actor":{"id":"repository-cleanup","role":"support"},"id":"retained-implementation-m2","procedure":"Historical evidence retention during user-authorized repository cleanup; no historical command was rerun or reassessed by this entry.","result":"inconclusive","subjects":[{"identity":"sha256:c7af8821db15d8e8cd51d94ee1dccd831a8bb78e6b234c187413e2dd02801c0d","path":"docs/implementation/explicit-recording-m2.md"}],"summary":"Retained verbatim from docs/implementation/explicit-recording-m2.md. Relative links, statuses, commands and identities below belong to that original historical document; they are not current navigation, approvals or verification.\n\n# Explicit Recording M2 — Isolated Implementation Evidence\n\n## Authority and scope\n\nThe user requested M2 implementation followed by independent review after the clean advisory M1 rereview. This is an isolated M2 request, not ordinary contract adoption or permission to begin M3. The current CLI lookup (`node packages/rigorloop/dist/bin/rigorloop.js workflow-context --change 2026-09-05-explicit-recording-and-model-centered-design --format json`) reports `RL_CONTEXT_CHANGE_NOT_FOUND`; no formal change state or gate identity is inferred.\n\nThe reviewed [CLI model](../design/cli.md), [Workflow model](../design/workflow.md), [delivery plan M2](../plans/2026-09-05-explicit-recording-and-model-centered-design.md) and [M1 rereview](../reviews/explicit-recording-m1-code-review.md) are the explicit basis. No project-map inference is needed: the selected package entrypoint, M1 validator and historical transaction implementation are inspected directly.\n\n## Same-slice completeness\n\nTG-03 requires the four command interfaces in text and JSON, byte-preserving recording, coherent inspection including absence/missing sidecars, read-only checking, closed arguments/limits, observations distinct from errors and containment. TG-04 requires exact revision/read/write preconditions, competing writers, interrupted publication/recovery, complete/restore, third-state and tampered-evidence stops, and protection of acknowledged commitment. Public subprocess proof and helper proof are both required; neither substitutes for the other.\n\nExisting historical engines, schemas and unrelated dirty files are not modification targets. Governance, skills and ordinary activation stay unchanged because they belong to later milestones. Existing compact transaction code is a reuse candidate, not proof that the new storage contract is implemented.\n\n## Initial preflight (historical)\n\nTest preparation began with five command cases: read-only absent inspection/checking, exact-byte creation/inspection, stale retry versus refreshed unchanged replacement, unknown-argument safe rejection, and refusal to claim an existing root without a manifest. `node --test packages/rigorloop/test/record-store-cli.test.js` produced the expected initial red result, `ERR_MODULE_NOT_FOUND` for the not-yet-implemented command module. The new draft test file was removed after the preflight blocker below was confirmed; it is not left as an unresolved import that breaks the package suite. No preexisting file was removed or reverted.\n\nBefore command implementation, independent preflight identified an unrepresentable input-error case. CLI Design requires rejection of unknown subcommands, missing selectors and invalid change IDs, but the result definition and M1 schema require one of four known operations and a valid change ID in every JSON result. There is no defined representation for an unavailable selector. Neither fabricating an ID nor silently selecting the legacy usage envelope is justified by the reviewed contract.\n\nThe recommended owner decision is to permit null only for unavailable `operation` or `change_id` selectors in rejected input-error results, with explicit conditional validation. Successful and other command-scoped results retain their existing identity requirements. A separately defined pre-dispatch usage envelope is an alternative. The CLI Design owner must select and independently review the bounded clarification before implementation adopts it; this evidence does not change the Design or schema.\n\n## Implementation and current handoff\n\nThe user explicitly authorized the bounded CLI rule refinement, independent Design rereview, M2 implementation and Code Review. The [advisory Design rereview](../reviews/explicit-recording-and-model-centered-design.md) approved the two-model package with the new selector-error rule and resolved ER-M2-001 at Design. No formal registration or ordinary activation is inferred.\n\nImplementation adds `record-store-cli.js` (argument parsing, bounded stdin, safe text/JSON output), `record-store.js` (explicit candidates, coherent reads, preconditions, journaling and recovery), and `record-store-files.js` (shared filesystem checks, streaming reads/hashes and synchronized writes). The canonical and packaged result schemas and M1 validator now admit unavailable selectors only in the specified rejection partition. Request/record identities remain strict. Schema bundling uses the existing M1 generator.\n\nThe existing dispatcher has dependency-injected fixture access and an import-safe exported `main`; ordinary CLI invocation still rejects the namespace. The test-only launcher under `packages/rigorloop/test/helpers/` is not shipped package data and exercises that same dispatcher/parser/renderer/storage path in real subprocesses. No environment variable or flag enables the ordinary entrypoint. Existing CLI observability, command vocabularies, semantic engines and release behavior are unchanged; new ordinary integration remains M4-owned. The entrypoint guard preserves invocation through a bin symlink.\n\nPrivate recovery contains one bounded before/candidate journal, a writer lock and an epoch marker for detecting overlapping completed writers. It is not a workflow record, request ledger or lifecycle decision source. Restore validates known before/candidate bytes and preserves unrelated files; completion rechecks declared decision-basis inputs. A committed journal cannot be restored. Fault hooks are dependency-injected test controls, not shipped CLI flags. No separate OS investigation, platform matrix, native dependency or platform-support claim was introduced.\n\n### Proof trace\n\n| Allocation | Direct cases |\n| --- | --- |\n| ER-M2-001 / TG-03 | Missing/unknown/invalid/repeated selectors, format fallback, no stdin access on argument rejection, null-selector schema partitions, public JSON safe errors |\n| CLI-SR-01/02/03/07 / TG-03 | Read-only inspect/check; exact explicit bytes; terminal-status recording with separate observations; missing sidecar visibility/repair; no registry removal or unrelated-file overwrite |\n| CLI-SR-04/08 / TG-04 | Revision/write/read identity conflict; stale lost-response retry; refreshed identical unchanged result; live competing subprocess; post-replacement read-set drift and exact restoration |\n| CLI-SR-05/06 / TG-04 | Pre-journal failure; prepared/partially published/committed interruption; multi-record mixed bytes withheld from inspection; actual process exit followed by public complete/restore in text/JSON; repeatable interrupted recovery; third-state and stale/missing/tampered/unknown-phase recovery stops |\n| CLI-SR-09/11 / TG-03/04 | Public/helper safe rejection, symlink/hard-link rejection, injected ancestor substitution without escaped bytes, overlapping completed writer detection, precise unsupported-contract and IO errors without payload echoes, ordinary namespace remains disabled |\n\n### Commands and results\n\nThe selector-schema test was written first and failed against the M1 validator, then passed after the bounded schema/runtime change. New command tests initially failed with the missing command module. Additional diagnostic tests reproduced two misclassified errors before correction.\n\n`node --test packages/rigorloop/test/record-store-cli.test.js packages/rigorloop/test/record-store-contract.test.js` passed all 38 tests on the review-requested revision. `npm --prefix packages/rigorloop test` passed 511 of 513 tests, with two existing skips and zero failures. `node scripts/build-record-store-schema.mjs --check` and `git diff --check` passed. These are local checks, not hosted CI or final Verify.\n\n`npm pack --dry-run --json` from `packages/rigorloop` exited 0: all four record-store modules and the schema bundle are included, while no `test/` files or fixture launcher are included. No archive was published or installed.\n\n## Core result\n\n- Skill: implement\n- Status: blocked\n- Completed scope: M2 command/storage implementation, three review-driven corrections and independent rereview; milestone closeout withheld\n- Artifacts changed: the explicitly named implementation, tests, schema bundle and this evidence; Design and review evidence remain separately owned\n- Tests added or updated: command/public-subprocess/failure tests and bounded M1 result-schema extension\n- Validation performed: commands and revision-specific results above\n- Validation result: all 48 focused tests pass; full package has 521 passes, two skips and zero failures\n- Open blockers: independent rereview reproduced a later external target-edit window; the exact guarantee needs a CLI Design owner decision\n- Next stage: resolve the external-writer guarantee at CLI Design; no automatic downstream handoff\n- Claim limitations: no clean-review, ordinary activation, M3, formal settlement, final Verify, commit or push\n\n## Independent Code Review outcome\n\n### Authorized safety correction proof\n\nThe user explicitly authorized fixing ER-M2-002/003/004 in this repository's isolated M2 scope. Operation: `fix`; command authority: `current-bounded`; write authority: `governed-scope-bound` under that explicit exception, limited to the two storage modules, existing CLI tests and this evidence. No lifecycle registration, Design change or activation is authorized. Each finding is a separately reproduced `race-or-timing` defect with `settled` CLI-SR-04/05/06/09 basis, `supported` cause, `feasible` tests and `failing-automated-test` proof.\n\nBefore production correction, `node --test --test-name-pattern='ER-M2-00[234]' packages/rigorloop/test/record-store-cli.test.js` exited 1: all ten new checks failed. Inputs use the existing explicit-recording fixture and disposable local directories. Controlled synchronous interposition schedules a competing journal before lock acquisition, a third-state edit at publication's actual expected-hash read, and ancestor substitution at each mutation syscall. Expected outcomes are preserved journal identity, preserved third-state bytes, and untouched outside targets. Observed outcomes included saved/recovered over third states, replaced prepared journal, and escaped writes/removals/creation. The committed-journal case returned conflict rather than recovery-required. Proof file SHA-256 before and after correction: `07ea8596dd05b1d28628a27155580a05f598a7ab4555528cf0b8a6a19d5e53b7`; environment: Node v24.14.1. The identical command and tests passed all ten after correction.\n\nThe two storage modules now recheck pending journals under writer exclusion, validate the exact publication precondition against recorded before/candidate identities, and share a synchronous verified-parent mutation boundary. The last boundary temporarily pins the working directory to the verified parent inode, uses only single relative basenames for mutations, and restores the caller's working directory in `finally`. It never yields or calls injected workflow hooks inside that section. Inputs still resolve only against explicit root. This adds no dependency, OS investigation, public command or platform certification claim.\n\nPost-correction validation: `node --test packages/rigorloop/test/record-store-cli.test.js packages/rigorloop/test/record-store-contract.test.js` passed all 48; `npm --prefix packages/rigorloop test` passed 521 of 523 tests, with two existing skips and zero failures; `node scripts/build-record-store-schema.mjs --check` and `git diff --check` exited 0. These are local checks, not hosted CI or final Verify.\n\nIndependent rereview confirmed the three original corrections but reproduced a distinct final-target window: a non-cooperating external writer changes the target after its final hash check, before the actual rename, and the recorder overwrites that edit. Parent anchoring does not make content comparison and rename indivisible. Passing current checks therefore does not close M2. Bugfix terminal result: `blocked`, not `fix-applied`; current action: `route-owner` for an explicit CLI Design guarantee decision. The recommended simple boundary is full exclusion for cooperating CLI writers and freshness at the observed check for non-cooperating external edits. That recommendation is not adopted by this evidence. No additional dependency, speculative precheck or implementation expansion was attempted; the reviewer owns its durable finding and disposition.\n\nThe [M2 advisory implementation review](../reviews/explicit-recording-m2-code-review.md) recorded `changes-requested` after independently reproducing three interleavings not covered by the green suite: a pending journal can appear between initial inspection and lock acquisition and be replaced (ER-M2-002); a new third-state hash can be promoted into an accepted replacement precondition (ER-M2-003); and late ancestor substitution can redirect pathname mutation outside the selected root before the post-write check detects it (ER-M2-004).\n\nThese were required safety corrections, not deferred acceptance criteria or new workflow rules. Corrections and regression proof are now recorded above; independent disposition remains review-owned. Public activation remains disabled, and M3 has not begun.\n"},{"actor":{"id":"repository-cleanup","role":"support"},"id":"retained-implementation-m3","procedure":"Historical evidence retention during user-authorized repository cleanup; no historical command was rerun or reassessed by this entry.","result":"inconclusive","subjects":[{"identity":"sha256:4a4b6b9a34ae19c1d67ceb87237f578ae2574a33c549b60fca9fb9105626b0f1","path":"docs/implementation/explicit-recording-m3.md"}],"summary":"Retained verbatim from docs/implementation/explicit-recording-m3.md. Relative links, statuses, commands and identities below belong to that original historical document; they are not current navigation, approvals or verification.\n\n# Explicit Recording M3 — Isolated Implementation Evidence\n\n## Authority and scope\n\nThe user authorized M3 after the clean advisory M2 Code Review. This permits the prospective workflow/model integration in the [delivery plan](../plans/2026-09-05-explicit-recording-and-model-centered-design.md), not ordinary activation, historical-contract conversion or new Design behavior. Profile: `IP0-isolated`. `rigorloop workflow-context` still reports `RL_CONTEXT_CHANGE_NOT_FOUND`; no registered milestone or automation state is inferred. Existing unrelated changes are preserved.\n\n## Design dependency (historical preflight)\n\nM3 requires TG-05 actor scenarios and TG-06 model/requirement verification mapping, including model-aware boundary validation. The [Workflow design](../design/workflow.md), Adoption support surfaces and completion check, explicitly requires model-scoped ownership and boundary/proof references to be defined before validator recognition changes. Its Boundary scan and Risks sections still identify this as unfinished Design reconciliation. The current [Design review](../reviews/explicit-recording-and-model-centered-design.md) resolves the external-edit guarantee, not this separate mapping obligation. The [Delivery review](../reviews/explicit-recording-and-model-centered-design-delivery.md) likewise retains the obligation and forbids defining new normative behavior through validator implementation.\n\nThe current validator only accepts top-level `specs/*.md` paths and expects the existing four-section feature boundary record. Both model documents instead contain eight concise scenario rows and explicitly disclaim equivalence to that record. Merely allowing `docs/design/` paths would neither define nor verify the model contract. Treating those rows as a replacement serialization without an author-owned decision would silently change the rule.\n\nThe smallest next step is a Design-owner clarification in the existing model documents: define how their existing requirement/scenario references map to validation and plan-owned proof, preserving one file per model. Independent Design assessment must precede dependent validator or skill changes. No extra Design files, OS investigation or storage work is needed. This evidence selects no new serialization, removes no proof obligation and does not reopen the resolved M2 concurrency decision.\n\n## Preflight result (historical)\n\n- Skill: implement\n- Status: blocked\n- Completed scope: M3 authority, dependency and validator preflight\n- Artifacts changed: this implementation evidence only\n- Tests added or updated: none; no production correction attempted\n- Validation performed: `node packages/rigorloop/dist/bin/rigorloop.js workflow-context --change 2026-09-05-explicit-recording-and-model-centered-design --format json`; `python scripts/validate-boundary-first.py --check --path docs/design/workflow.md --path docs/design/cli.md`\n- Validation result: context reports the absent registered change; boundary command exits 1 with two `BFR-INVALID-CHANGED-PATH` errors\n- Open blockers: model-file boundary/reference contract remains explicitly unowned by implementation\n- Next stage: blocked pending Workflow/CLI Design reconciliation and affected independent review\n- Claim limitations: no M3 implementation completion, Code Review, activation, lifecycle settlement, Verify, commit or push\n\n## Current implementation basis\n\nThe user authorized the model-validation refinement, independent Design rereview and M3 resumption. The [current Design rereview](../reviews/explicit-recording-and-model-centered-design.md), Model-validation mapping section, resolved the preceding dependency. Implementation uses that reviewed two-model package, the existing advisory Delivery Review and M2 clean rereview. No formal lifecycle state is inferred or initialized. No project-map inference is needed; implementation follows the exact approved inventory and directly inspected sources.\n\nModel-only document checks now dispatch separately from historical feature/activation validation. They require contained nonsymlink model paths, the explicit contract marker, exact table headings/columns, stable unique requirement IDs, each known dimension once, local references and reasoned non-applicability. Unknown vocabulary fails closed. A model-only public check works without activation/change records and reports `structure-and-references-only`; historical and mixed validation retain their activation checks. It never invokes the recorder or writes status.\n\nEleven stage entrypoints have concise prospective profiles with model-owned record/field responsibilities, explicit identity-based recording, independent review, stale-evidence handling and success-only Verify. Model documents supply record shapes and validation mapping; historical shape/transition resources are not loaded as new-contract prerequisites. Existing substantive stage duties, permissions and proof remain. Governance adds scoped prospective text rather than replacing active historical rules. Ordinary activation remains disabled.\n\n### Exact inventory and retained surfaces\n\n| Approved scope | Implemented surfaces | Retained surfaces and rationale |\n| --- | --- | --- |\n| WF-MAP-01/10 | `CONSTITUTION.md`, `AGENTS.md` | Historical precedence and lifecycle rules remain outside the isolated profile. |\n| WF-MAP-02–06 | `specs/rigorloop-workflow.md`, `specs/compact-current-state-change-record.md` | Historical schemas, semantic handlers, records and prior findings remain untouched; no conversion. |\n| WF-MAP-07 | `docs/architecture/system/architecture.md`, Source of truth | Unrelated architecture, ADRs and historical runtime flow remain readable; no new architecture sidecar. |\n| WF-MAP-08/09 and stage consumers | `skills/architecture/SKILL.md`, `skills/spec/SKILL.md`, `skills/route/SKILL.md`, `skills/proposal/SKILL.md`, `skills/proposal-review/SKILL.md`, `skills/design-review/SKILL.md`, `skills/plan/SKILL.md`, `skills/delivery-review/SKILL.md`, `skills/implement/SKILL.md`, `skills/code-review/SKILL.md`, `skills/verify/SKILL.md` | Existing references/assets retain historical procedures and generic engineering methods. New profiles use project model contracts for shapes, rather than adding or loading historical package/transition scaffolds. No new resource chains or public skill are introduced. Support skills retain their own artifact duties; prospective governance covers their actor-owned blocker/evidence obligations without arming automation. |\n| Adoption support / TG-06 | `specs/skill-contract.md`, `specs/boundary-first-proof-model.md`, `scripts/boundary_first_validation.py`, `scripts/validate-boundary-first.py`, `scripts/test-boundary-first-validation.py`, `scripts/test-skill-validator.py` | Historical boundary reference projections and skill validator stay unchanged; no new resource shape requires changing their validation. Model interpretation is a separate explicit path, not a widened historical parser. |\n| TG-05 | `packages/rigorloop/test/record-store-workflow.test.js` | Uses the unchanged M2 dispatcher fixture and storage modules. Simulated roles are not actual reviewer provenance. |\n| M4-only integration | None in this slice | Public contract/command registration, workflow-context activation metadata, scaffolds, generated public adapters, support manifest, CI selection/cutover and rollback agreement remain M4. Temporary skill generation is checked here; no installed mirror or public archive is hand-edited. |\n\n### Requirement-to-check mapping\n\nThe stable plan owns allocation. This implementation evidence names concrete proof for that allocation without moving design truth or current progress into the plan. TG-01/02 cases are in `record-store-contract.test.js`, TG-03/04 in `record-store-cli.test.js`, TG-05 in `record-store-workflow.test.js` plus the independent walkthrough, and TG-06 in `ModelRecordTests` and `ExplicitRecordingGuidanceTests`. Later-stage allocations are explicitly not claimed complete.\n\n| Requirement | Concrete allocation/proof |\n| --- | --- |\n| WF-SR-01 | TG-05 exact actor replacements; inspect/save leave activity unchanged unless supplied. |\n| WF-SR-02 | TG-01 all record representations; TG-05 current subjects, activity, registry and blockers. |\n| WF-SR-03 | TG-05 attribution validator case plus independent walkthrough of same-contributor review; role text cannot establish separation. |\n| WF-SR-04 | TG-05 model drift, explicit stale applicability and route-selected correction owner. |\n| WF-SR-05 | TG-05 Verify-originated blocker and failed evidence with absent success report. |\n| WF-SR-06 | TG-05 completed-owner reopening, retained blocker and review on correction return. |\n| WF-SR-07 | TG-06 current model paths/tables and canonical profile reachability; independent cross-model walkthrough. |\n| WF-SR-08 | TG-05 two exact model subjects, retained old review bytes and reassessment; TG-06 stable local ID/reference validation. |\n| WF-SR-09 | TG-05 explicit final Verify replacement and stale-evidence refusal in walkthrough; later complete-change readiness remains TG-FINAL-01. |\n| WF-SR-10 | TG-02 historical rejection and TG-06 unchanged historical boundary tests; full adoption TG-07/TG-FINAL-02 remain M4. |\n| CLI-SR-01 | TG-03 read-only inspect/check; TG-05 drift observation without activity mutation. |\n| CLI-SR-02 | TG-01 closed vocabulary/reference cases; TG-03 malformed argument and safe rejection cases. |\n| CLI-SR-03 | TG-05 asserts exact submitted bytes after every save; TG-03 preserves unnamed files. |\n| CLI-SR-04 | TG-04 revision/read/write checks and competing subprocess; TG-05 declares current model read identities. |\n| CLI-SR-05 | TG-04 mixed snapshot rejection and interrupted multi-record publication. |\n| CLI-SR-06 | TG-04 explicit complete/restore, observed third-state stops and committed rollback refusal. |\n| CLI-SR-07 | TG-05 old subject drift and stale applicability remain separate from storage rejection. |\n| CLI-SR-08 | TG-04 stale retry and refreshed identical request; no incremental workflow operation. |\n| CLI-SR-09 | TG-03 unsafe targets; ER-M2-004 five sibling late-parent tests. |\n| CLI-SR-10 | TG-02/03 historical/new contract separation; final integrated cutover remains TG-07/TG-FINAL-02. |\n| CLI-SR-11 | TG-03 text/JSON dispatcher, truthful selector errors and safe diagnostics. |\n\n### Scenario-row and combined-hazard mapping\n\nEach cell uses the exact model path plus the existing dimension label; no new boundary ID series is introduced. TG-06 structural tests check all eight rows in each model, not their semantic adequacy.\n\n| Dimension label | `docs/design/workflow.md` proof | `docs/design/cli.md` proof |\n| --- | --- | --- |\n| Input domain | TG-05 Verify blocker and incomplete/false independence walkthrough | TG-01 closed records and TG-03 exact replacements |\n| State/lifecycle | TG-05 reopen completed owner | TG-05 explicit completion does not block later correction recording |\n| Identity/authority | TG-05 retained subjects and same-contributor walkthrough | TG-04 stale identities and ER-M2-004 containment |\n| Composition/path | TG-05 two model subjects and independent walkthrough | TG-03 dispatcher/helper and TG-04 recovery siblings |\n| Temporal/retry | TG-05 retained review after model edit; walkthrough rejects replay | TG-04 live contender and lost-response retry |\n| Failure/recovery | TG-05 Verify failure without success report | TG-04 interruption, restore/complete and mixed-state rejection |\n| Compatibility/migration | TG-02 unchanged historical contract and TG-06 historical feature tests; integrated adoption M4 | TG-02/03 historical write refusal; integrated adoption M4 |\n| External/environment | TG-05 fresh disposable root/records and independent walkthrough without Git/PR history | TG-03 safe errors, TG-04 observed external edits; final-window external-edit exclusion retained |\n\nWorkflow combined hazards (changed subject plus old approval, completed owner plus correction, and cross-model edits plus reliance) use TG-05 and the walkthrough. CLI combined hazards (stale review plus correction, competing writer plus basis drift, and partial commit plus retry/external edit) use TG-04/05. TG-FINAL-01/02 remain the later cross-milestone integration proof, not a substitute for this scoped coverage.\n\n## Validation and independent handoff\n\nTests first: the seven new `ModelRecordTests` initially produced six failing assertions across four test methods because current models/markers were unrecognized and the public command demanded activation data. The prospective-guidance test initially failed for all eleven missing profiles. Both focused checks passed after implementation. The new public-recorder TG-05 scenario passed against the unchanged M2 runtime; it expands proof rather than correcting storage behavior.\n\nThe first full skill test run found two quick-guide placement failures caused by the added profiles. Their quick guides were moved earlier without changing semantics; the targeted placement/profile tests and full rerun now pass. No passing structural test substitutes for semantic review.\n\n- `python scripts/validate-skills.py skills`: passes, 20 canonical skills.\n- `python scripts/test-skill-validator.py`: final rerun passes, 366 tests.\n- `python scripts/test-boundary-first-validation.py`: passes, 78 tests after ER-M3-001 correction.\n- `python scripts/validate-boundary-first.py --check --path docs/design/workflow.md --path docs/design/cli.md`: passes, structure/reference-only.\n- `npm --prefix packages/rigorloop test`: passes, 525 total / 523 passed / two existing skips / zero failures.\n- `python scripts/build-skills.py --check`: passes again after quick-guide relocation, using disposable generated output.\n- `node scripts/build-record-store-schema.mjs --check` and `git diff --check`: pass.\n\n### Independent semantic walkthrough\n\nActor `/root/m3_walkthrough` was separately delegated a raw scenario and the canonical route, Design Review and Verify skills plus both model documents; it authored none of the implementation or guidance. The request supplied completed design work, a changed model, a same-ID author/reviewer with an earlier subject, and a newly discovered Verify defect. It supplied no required answer or successful approval. All writes stayed in a disposable fixture; the separate actor's report and inspected orchestration confirmed the actions below.\n\nInput basis was `tests/fixtures/explicit-recording-v1/records.json`. The synthetic prior model contained `Acceptance: correction is independently reviewed.`; the current model omitted that proposal-required statement. The retained approval deliberately used reviewer/contributor ID `author` and kept its original open finding. The actor ran a temporary Node orchestration script that submitted LF-terminated JSON to `node packages/rigorloop/test/helpers/record-store-launcher.mjs record-store check --root <fixture> --change example --input - --format json`, then the equivalent `record`, then `inspect` without stdin. Each request used the preceding snapshot revision/target identities and current model/proposal read identities. This is an independent manual procedure, not an additional committed operation/script artifact.\n\nFour check/record/inspect cycles returned `valid`/`saved`/`inspected`, each storage-only: establish the deliberately unsupported inherited state; mark stale applicability and record `basis-and-independence` while explicitly reopening the completed design owner; execute the acceptance-statement check and record `verify-missing-acceptance` plus failed evidence; explicitly select the same design owner for that correction. The original review bytes and finding stayed unchanged. Subject drift remained visible; failed evidence appeared without preventing the blocker save. No success report was created. The actor correctly withheld final completion because actual independent approval and current complete proof were absent, and identified the author, separate reviewer and Verify's remaining duties. No semantic guidance ambiguity prevented the correction path.\n\nThe fixture initially omitted the required final LF and the preexisting `docs/changes` parent. Record safely rejected those setup