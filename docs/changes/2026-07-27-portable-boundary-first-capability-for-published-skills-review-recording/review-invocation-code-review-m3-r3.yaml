risk_map:
  affected_behavior: M3 R2 corrections for activation-time history, later adoption, rollback, explicit and derived containment, Markdown alignment, deletion handling, and historical inventory symlinks
  highest_impact_failure_modes: activation history is rewritten, accepted marked contracts become invalid after rollback, companion or inventory paths escape the repository, deletion removes required proof silently, or valid Markdown is rejected
  changed_boundaries: activation history versus current adoption, rollback marker gate, explicit and derived spec resolvers, table separator grammar, absent counterpart handling, and historical inventory enumeration
  evidence_expected: direct adversarial reproductions for PBF-M3-CR9 through PBF-M3-CR13, 44 focused tests, pending baseline validation, 134 selector tests, and bounded diagnostics
  direct_inspection_areas: active and rolled-back membership, marked historical contracts, companion symlinks, specs-root and leaf symlinks, paired versus orphan deletion, aligned separator cells, and unknown-value ordering
  intentionally_out_of_scope: active-state writer, final inventory generation, adapter/install parity, M4 activation transaction, runtime certification, and external actions
  applicable_risk_classes:
    - requirement-fidelity
    - compatibility
    - path-containment
    - parser-correctness
    - negative-proof
    - lifecycle-state
  non_applicable_risk_classes:
    - network-api
    - credential-storage
    - release-publication
    - runtime-attestation
  falsifiable_questions:
    - Can later adoption or rollback invalidate immutable activation history?
    - Can any explicit, derived, or inventory path follow a symlink outside repository ownership?
    - Can deleting an adopting proof or leaving an orphan test bypass validation?
    - Can a valid CommonMark alignment separator fail or a malformed separator pass?
    - Can any PBF-M3-CR9 through PBF-M3-CR13 reproduction still pass unexpectedly or traceback?
