  affected_behavior: deterministic feature/proof record validation, pending activation baseline validation, and changed-path routing
  highest_impact_failure_modes: malformed records pass, valid concise records fail, semantic completeness is overclaimed, stale activation evidence passes, or selected validation omits changed adopting specs
  changed_boundaries: Markdown parser and closed vocabularies, proof reference graph, activation baseline, diagnostic output, and validation selector commands
  evidence_expected: valid concise and complex fixtures, fail-closed unknown values, direct proof coverage, stale identity failures, changed feature/test-spec command routing, and privacy-bounded diagnostics
  direct_inspection_areas: parser ordering, vocabulary-before-consistency behavior, reference ownership, activation digests and grandfathering, CLI path handling, selector command construction, and negative fixture quality
  intentionally_out_of_scope: active-state writer, complete grandfathered inventory generation, adapter and installed-tree parity, runtime certification, and external actions
  applicable_risk_classes:
    - requirement-fidelity
    - parser-correctness
    - negative-proof
    - compatibility
    - lifecycle-state
    - validation-selection
  non_applicable_risk_classes:
    - network-api
    - credential-handling
    - release-publication
    - runtime-attestation
  falsifiable_questions:
    - Can an unknown closed value reach a consistency diagnostic first?
    - Can a proof map satisfy coverage with a gap, renamed ID, or unrelated feature ID?
    - Can stale or divergent activation identities pass?
    - Can a structurally valid semantic omission be rejected as though the validator owned semantic completeness?
    - Does selection run the validator against the actual changed feature or test spec?
