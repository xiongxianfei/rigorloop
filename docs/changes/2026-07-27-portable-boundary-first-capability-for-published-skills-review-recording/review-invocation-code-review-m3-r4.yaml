risk_map:
  affected_behavior: M3 R3 corrections add a durable rollback-preserved path-and-byte inventory, reject post-rollback self-authorization, and contain fixed activation and proof-model inputs
  highest_impact_failure_modes: a new marker can still adopt after rollback, a preserved accepted marker is invalidated, mutable current text substitutes for the rollback baseline, a fixed authoritative symlink is read, or the amended contract diverges from implementation
  changed_boundaries: activation schema, rollback preservation snapshot and membership, changed-spec rollback gate, fixed authoritative input resolver, proof-model requirements, test proof, and ADR
  evidence_expected: direct PBF-M3-CR14 and PBF-M3-CR15 reproductions, 47 focused tests, pending baseline validation, 134 selector tests, reference tests, lifecycle checks, and no semantic overclaim
  direct_inspection_areas: new-after-rollback markers, preserved member path and bytes, missing/stale/reordered rollback entries, inventory digest, activation/proof-model leaf symlinks, changed-spec activation lookup, field closure, and contract/test/ADR coherence
  intentionally_out_of_scope: activation writer, final inventory generation, package/install parity, full M4 rollback transaction, runtime certification, and external actions
  applicable_risk_classes:
    - requirement-fidelity
    - compatibility
    - path-containment
    - negative-proof
    - lifecycle-state
  non_applicable_risk_classes:
    - network-api
    - credential-storage
    - release-publication
    - runtime-attestation
  falsifiable_questions:
    - Can any unrecorded or byte-divergent marker pass after rollback?
    - Can a preserved exact member fail solely because activation is rolled back?
    - Can either fixed authoritative input follow a leaf or parent symlink before reads?
    - Can an unknown, malformed, stale, or recomputed rollback inventory bypass closed validation?
    - Do the amended requirement, test proof, ADR, activation record, and validator describe one mechanism?
