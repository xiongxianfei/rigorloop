  evidence_expected: governing clauses and schema, cumulative diff, reciprocal and vocabulary marker probes, focused T24 proof, malformed-profile regression, historical package tests, and prior-finding reconciliation
  direct_inspection_areas: authority parser and both marker branches, path-aware T24 fixtures, schema lifecycle vocabulary, profile namespace branch, fixture identity helpers, and change-local review evidence
