    - package-supply-chain
    - compatibility-and-migration
    - lifecycle-closeout
  non_applicable_risk_classes:
    - live-publication
    - external-mutation
  falsifiable_questions:
    - Does exact stage-owned authority reject status placement and accept owner placement?
    - Does only an absent lifecycle contract retain the historical status form while present unknown values fail?
    - Does semantic YAML scalar identity, including quoting, preserve authority classification?
    - Do malformed profiles and historical package fixtures remain corrected?
