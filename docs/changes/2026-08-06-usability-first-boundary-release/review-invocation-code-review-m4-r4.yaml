risk_map:
  affected_behavior: durable final-review finding counts and closeout routing
  highest_impact_failure_modes: wrong receipt occurrence, historical/current count conflation, unresolved CR3, mismatched overview/detail IDs, or changed implementation conclusion
  changed_boundaries: M4 R2 receipt, CR3 finding closeout, review ledger, and change-local routing
  evidence_expected: exact one-line diff, live receipt search, independent historical/current count parse, overview/detail set equality, focused validators, and diff check
  direct_inspection_areas: M4 R2 count sentence, resolution summary and rows, CR3 detail, review log, and change state
  intentionally_out_of_scope: implementation behavior, release validation, explain-change, verify, PR, tag, publication, push, and merge
  applicable_risk_classes:
    - requirement-fidelity
    - review-recording
    - lifecycle-closeout
  non_applicable_risk_classes:
    - implementation-behavior
    - live-publication
    - external-mutation
  falsifiable_questions:
    - Does the live M4 R2 receipt say exactly 26 historical findings?
    - Are there exactly 26 historical findings plus CR3 as the twenty-seventh current finding?
    - Can CR3 close without changing the implementation conclusion?
