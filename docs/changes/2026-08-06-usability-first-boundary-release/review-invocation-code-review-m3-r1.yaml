  evidence_expected: deterministic final preparation, exact identity binding, reproducible archives, three-target packed smoke, pending-state proof, rollback proof, and both executable release gates
  direct_inspection_areas: release profile and generated surfaces, adapter and package metadata, closed release sets, standing gate, trusted workflow, activation record, rollback record, and closeout tooling
  intentionally_out_of_scope: M4 active snapshot, live tag or publication, final holistic review, explain-change, verify, and PR readiness
  applicable_risk_classes:
    - requirement-fidelity
    - release-identity-and-authority
    - generated-artifact-reproducibility
    - package-supply-chain
    - recovery-and-rollback
    - privacy
  non_applicable_risk_classes:
    - live-publication
    - active-snapshot-authoring
  falsifiable_questions:
    - Does the final reviewed tree pass preparation drift checks?
    - Can ambient npm configuration change the required latest tag?
    - Does the trusted gate independently bind the immutable tag commit?
    - Is every architecture-required standing release surface present?
