  evidence_expected: governing clauses and schema, cumulative diff, reciprocal and vocabulary probes, semantic-key duplicate probes, focused T24 proof, malformed-profile regression, historical package tests, and prior-finding reconciliation
  direct_inspection_areas: authority parser and both marker branches, repository YAML tokenizer/parser, T24 fixtures, lifecycle schema, profile namespace branch, fixture identity helpers, and review evidence
  intentionally_out_of_scope: broad smoke, hosted CI, PR opening, push, tag, publication, merge, and public closeout
