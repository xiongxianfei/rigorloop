    - Do exact quoted and unquoted stage-owned values select only owner placement?
    - Does only absent lifecycle authority retain historical status placement?
    - Do unknown, malformed, and duplicate authorities fail before marker consistency?
    - Does repository-accepted YAML key spacing preserve authority and duplicate classification?
    - Do malformed profiles and historical v0.3.3 fixture identities remain corrected?
