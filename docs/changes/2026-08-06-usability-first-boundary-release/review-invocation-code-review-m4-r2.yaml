  evidence_expected: meaningful archived-root wrapper execution, full selector suite, direct grandfathered negative proof, independent baseline and inventory proof, current-file validation, release preparation and validation, prior-finding reconciliation, and final lifecycle state
  direct_inspection_areas: selector correction, archived change root, active activation tuple, Git tree inventory, proof-model readiness, rollback metadata, release records, review resolution, and cumulative diff
  intentionally_out_of_scope: explain-change, final verify, PR readiness, live tag creation, push, publication, merge, and public closeout
  applicable_risk_classes:
    - requirement-fidelity
    - validation-routing
    - checked-revision-activation
    - compatibility-and-selector-integration
    - release-identity-and-authority
    - package-supply-chain
    - recovery-and-rollback
    - lifecycle-closeout
    - privacy
  non_applicable_risk_classes:
    - live-publication
    - external-mutation
  falsifiable_questions:
    - Does the corrected fixture execute both review-root and explicit lifecycle paths?
    - Does a changed grandfathered spec still require BFR-GRANDFATHERED-REVIEW?
    - Does the independently reconstructed inventory still equal the active record?
    - Are all prior findings resolved and all implementation milestones eligible to close?
