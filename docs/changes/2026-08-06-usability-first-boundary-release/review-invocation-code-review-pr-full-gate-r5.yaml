  affected_behavior: top-level lifecycle mapping-key discovery and lifecycle-selected marker placement
  highest_impact_failure_modes: spaced exact authority treated as absent, spaced unknown downgraded to legacy, mixed-spelling duplicate overwritten, malformed value checked after marker placement, or helper semantics escaping repository mapping rules
  changed_boundaries: repository-style top-level key tokenization, occurrence preservation, scalar classification, and marker branch selection
  evidence_expected: exact correction diff, repository parser comparison, direct authority matrix, focused regressions, full boundary suite, and prior-finding reconciliation
  direct_inspection_areas: bounded helper, authority classifier, both marker branches, repository tokenizer/mapping split, and T24 regressions
  intentionally_out_of_scope: selector, CLI package fixtures, broad smoke, release validation, hosted CI, PR opening, push, tag, publication, merge, and public closeout
