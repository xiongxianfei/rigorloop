    - requirement-fidelity
    - spec-derived-validation
    - closed-vocabulary-validation
    - compatibility-and-migration
    - lifecycle-closeout
  non_applicable_risk_classes:
    - release-routing
    - package-supply-chain
    - live-publication
    - external-mutation
  falsifiable_questions:
    - Do canonical, spaced, and quoted exact values select only owner placement?
    - Does absence alone retain historical status placement?
    - Do canonical and spaced unknown or malformed values fail before marker consistency?
    - Do canonical and mixed-spelling duplicates fail before scalar or placement consistency?
    - Does the bounded helper match repository mapping-key normalization for the admitted top-level contract?
