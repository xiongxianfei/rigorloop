  evidence_expected: independent baseline and inventory proof, no-history active validation, independently valid pending fixtures, exact rollback identities, selector integration, release preparation and preflight, selected CI, full standing gate, and no external mutation
  direct_inspection_areas: activation tuple, M3 review provenance, Git tree inventory, proof-model readiness, pending fixtures, selector fixtures, rollback metadata, release evidence, and archive-source separation
  intentionally_out_of_scope: live tag creation, push, publication, merge, public closeout, explain-change, verify, and PR readiness
  applicable_risk_classes:
    - requirement-fidelity
    - checked-revision-activation
    - compatibility-and-selector-integration
    - release-identity-and-authority
    - package-supply-chain
    - recovery-and-rollback
    - privacy
  non_applicable_risk_classes:
    - live-publication
    - external-mutation
  falsifiable_questions:
    - Is the baseline exactly the pending source reviewed by M3 R7?
    - Does an independent Git-tree reconstruction equal the frozen 78-item tuple?
    - Can normal active validation run with no history, tag, remote, network, or derivation call?
    - Does active state preserve every ordinary selector and routine release path?
