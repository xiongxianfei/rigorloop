risk_map:
  affected_behavior: complete, unambiguous, and state-correct release evidence before preservation or public closeout
  highest_impact_failure_modes: emergency gate omission, unsupported deferral, inapplicable public proof, contradictory duplicate rows, or whitespace-only smoke evidence
  changed_boundaries: BND-AUTH-001, BND-COMPOSE-001, BND-TEMPORAL-001, BND-RECOVERY-001, BND-ENV-001, INT-002, and INT-003
  evidence_expected: complete routine and emergency row mutation matrices, state-specific allowed-result proof, prior-finding reproductions, and focused release gates
  direct_inspection_areas: governed row inventories, table cardinality, result vocabularies, emergency deferral binding, preservation predicates, and mutation tests
  intentionally_out_of_scope: M4 active snapshot, live publication, final holistic review, verify, and PR readiness
  applicable_risk_classes:
    - requirement-fidelity
    - pending-public-separation
    - emergency-recovery
    - compatibility
    - generated-artifact-currency
  non_applicable_risk_classes:
    - live-publication
    - active-snapshot-authoring
  falsifiable_questions:
    - Does each of the ten preflight rows appear exactly once in routine and emergency evidence?
    - Does each of the five registry rows appear exactly once with a state- and applicability-correct result?
    - Can unsupported, inapplicable, or unbound deferred results pass pending, finalized, or emergency validation?
    - Can whitespace-only passing smoke proof be preserved?
    - Do hosted-tag identity, manifest binding, and pending-public safeguards remain intact?
