name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rigorloop-release
  cancel-in-progress: false

env:
  RELEASE_EVIDENCE_REF: ${{ vars.RELEASE_EVIDENCE_REF }}
  RELEASE_TRUSTED_PUBLISHER: ${{ vars.RELEASE_TRUSTED_PUBLISHER }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.candidate.outputs.ready }}
      candidate_id: ${{ steps.candidate.outputs.candidate_id }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id || steps.candidate.outputs.artifact_id }}
      artifact_digest: ${{ steps.artifact.outputs.artifact-digest || steps.candidate.outputs.artifact_digest }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install check dependencies
        run: npm ci --prefix packages/rigorloop --ignore-scripts --no-audit --no-fund
      - name: Prepare and check candidate
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/release-coordinator.py prepare
      - name: Retain original candidate
        id: artifact
        if: steps.candidate.outputs.ready == 'true' && github.run_attempt == 1
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/release-candidate/*
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          compression-level: 0

  execute:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      deployments: read
      id-token: write
    steps:
      - name: Check out exact workflow source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node for trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install check dependencies
        run: npm ci --prefix packages/rigorloop --ignore-scripts --no-audit --no-fund
      - name: Publish approved candidate, observe and report
        id: operation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CANDIDATE_ID: ${{ needs.prepare.outputs.candidate_id }}
          RELEASE_ARTIFACT_ID: ${{ needs.prepare.outputs.artifact_id }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.prepare.outputs.artifact_digest }}
        run: python scripts/release-coordinator.py execute
      - name: Retain observed outcomes for recovery
        if: always() && steps.operation.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: release-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-candidate/observed-outcome.json
          if-no-files-found: warn
          retention-days: 30
          overwrite: false
