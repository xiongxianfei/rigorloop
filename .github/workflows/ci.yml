name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Temporary Git repositories must outlive all of their maintenance writers.
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: gc.autoDetach
      GIT_CONFIG_VALUE_0: "false"
      GIT_CONFIG_KEY_1: maintenance.autoDetach
      GIT_CONFIG_VALUE_1: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install public package dependencies
        run: npm ci --prefix packages/rigorloop --ignore-scripts --no-audit --no-fund

      - name: Run essential tests
        run: bash scripts/ci.sh
