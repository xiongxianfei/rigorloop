# Copy and fill only from current project authority.
name: <workflow name>

on:
  <explicitly authorized trigger>

permissions:
  contents: read

concurrency:
  group: <project-derived concurrency key>
  cancel-in-progress: true

jobs:
  <ordinary job id>:
    name: <ordinary job name>
    runs-on: <authorized runner>
    timeout-minutes: <bounded timeout>
    steps:
      - name: Checkout
        uses: actions/checkout@<project-approved reference>
      - name: Setup
        uses: <project-approved setup action and reference>
      - name: Run project check
        run: <authoritative project command>
