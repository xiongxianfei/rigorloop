description = "An assessor supplies actual content and basis; preparation exposes gaps and reliance limits. Guided recording preserves actor decisions and reports actual effects. Uncertain retention requires scoped readback, while conflict requires reassessment. Preparation and saved outcomes supply neither verification observations nor approval."
